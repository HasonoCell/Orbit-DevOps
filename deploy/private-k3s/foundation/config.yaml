apiVersion: v1
kind: ConfigMap
metadata: {name: orbit-config, namespace: orbit-system}
data:
  ORBIT_DEVOPS_MIGRATE_ON_BOOT: "false"
  ORBIT_DEVOPS_CLUSTER_REF: "orbit-private-k3s"
  ORBIT_DEVOPS_NAMESPACE: "orbit-apps"
  ORBIT_DEVOPS_BUILD_NAMESPACE: "orbit-builds"
  ORBIT_DEVOPS_REDIS_ADDRESS: "redis.orbit-system.svc.cluster.local:6379"
  ORBIT_DEVOPS_EXTERNAL_URL: "http://127.0.0.1:18080"
  ORBIT_DEVOPS_TRUSTED_ORIGINS: "http://127.0.0.1:18080"
  ORBIT_DEVOPS_ALLOW_LOOPBACK_HTTP: "true"
  ORBIT_DEVOPS_BUILD_PLATFORM: "linux/amd64"
  ORBIT_DEVOPS_BUILD_REGISTRY_HOST: "registry.orbit-builds.svc.cluster.local:5000"
  ORBIT_DEVOPS_BUILD_REGISTRY_PREFIX: "orbit-devops"
  ORBIT_DEVOPS_BUILD_REGISTRY_INSECURE: "true"
  ORBIT_DEVOPS_BUILD_DOCKERHUB_MIRROR: "docker.m.daocloud.io"
  ORBIT_DEVOPS_BUILD_CPU: "1"
  ORBIT_DEVOPS_BUILD_MEMORY: "2Gi"
  ORBIT_DEVOPS_BUILD_SOURCE_STORAGE_LIMIT: "1Gi"
  ORBIT_DEVOPS_BUILD_BUILDKIT_STORAGE_LIMIT: "8Gi"
  ORBIT_DEVOPS_BUILD_EPHEMERAL_STORAGE_REQUEST: "1Gi"
  ORBIT_DEVOPS_BUILD_EPHEMERAL_STORAGE_LIMIT: "10Gi"
  ORBIT_DEVOPS_BUILD_QUEUE_CONCURRENCY: "1"
  ORBIT_DEVOPS_RELEASE_QUEUE_CONCURRENCY: "1"
  ORBIT_DEVOPS_GATEWAY_QUEUE_CONCURRENCY: "1"
  ORBIT_DEVOPS_PIPELINE_QUEUE_CONCURRENCY: "2"
  ORBIT_DEVOPS_DB_MAX_OPEN_CONNS: "6"
  ORBIT_DEVOPS_DB_MAX_IDLE_CONNS: "2"
  ORBIT_DEVOPS_GATEWAY_CLASS_NAME: "orbit-private"
  ORBIT_DEVOPS_ACCESS_ISSUER_POLICIES_JSON: '{"private-test":{"kind":"Issuer","name":"orbit-private-selfsigned"}}'
  GOMEMLIMIT: "300MiB"
