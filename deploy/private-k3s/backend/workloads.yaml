apiVersion: apps/v1
kind: Deployment
metadata: {name: orbit-api, namespace: orbit-system}
spec:
  replicas: 1
  selector:
    matchLabels: {app: orbit-api}
  template:
    metadata:
      labels: {app: orbit-api, app.kubernetes.io/part-of: orbit-devops}
    spec:
      serviceAccountName: orbit-api
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: orbit-devops/backend:password-policy-20261008-1@sha256:d22efa3d4dd8be0172f5760c8d677e745cff3210258c410965d71ba846e201ca
          imagePullPolicy: Never
          command: [/usr/local/bin/orbit-devops-api]
          envFrom:
            - configMapRef: {name: orbit-config}
            - configMapRef: {name: orbit-cluster-identity}
          env:
            - {name: ORBIT_DEVOPS_API_ADDRESS, value: "0.0.0.0:8080"}
            - name: ORBIT_DEVOPS_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: orbit-database, key: url}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          # 不以数据库故障触发重启风暴；进程存活与依赖可用分别检查。
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
