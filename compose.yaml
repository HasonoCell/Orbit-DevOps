name: orbit-devops-s1

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: orbitdevops
      POSTGRES_USER: orbitdevops
      POSTGRES_PASSWORD: orbitdevops
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitdevops -d orbitdevops"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - orbit-devops-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - orbit-devops-redis:/data

  # 仅用于本机 OIDC 专项验收；profile 不会改变默认 PostgreSQL/Redis 启动集合。
  keycloak:
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:26.7.3@sha256:29be7252db0a106f1cd2ac17b9a56ff2668073da645638a38b9fc67deeb2d6c4
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ORBIT_DEVOPS_KEYCLOAK_ADMIN_USERNAME:-orbit-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ORBIT_DEVOPS_KEYCLOAK_ADMIN_PASSWORD:-}
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname=http://127.0.0.1:8180
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./test/keycloak/orbit-devops-realm.json:/opt/keycloak/data/import/orbit-devops-realm.json:ro

volumes:
  orbit-devops-postgres:
  orbit-devops-redis:
