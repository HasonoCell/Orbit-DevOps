openapi: 3.0.3
info:
  title: Orbit-DevOps API
  version: 0.1.0
  description: Orbit-DevOps 应用交付控制平面的公开 HTTP 契约。
security:
  - CookieAuth: []
paths:
  /api/v1/auth/providers:
    get:
      operationId: listAuthProviders
      summary: 查询可用登录入口
      security: []
      responses:
        "200": {description: 登录入口, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AuthProviderSummary"}}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/auth/oidc/{providerId}/start:
    post:
      operationId: startOIDCLogin
      summary: 开始 OIDC 登录
      security: []
      parameters: [{$ref: "#/components/parameters/ProviderId"}]
      responses:
        "200": {description: 授权入口, content: {application/json: {schema: {$ref: "#/components/schemas/OIDCStart"}}}}
        "503": {description: 提供方不可用, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/auth/oidc/callback:
    get:
      operationId: completeOIDC
      summary: 完成一次性 OIDC 流程
      security: []
      parameters:
        - {name: state, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 512}}
        - {name: code, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
      responses:
        "303": {description: 流程已完成, headers: {Location: {schema: {type: string}}}}
        "400": {description: 一次性证明无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: 准入被拒绝, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "503": {description: 提供方不可用, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/auth/oidc/{providerId}/reauth:
    post:
      operationId: startOIDCReauthentication
      summary: 开始 OIDC 近期认证
      parameters: [{$ref: "#/components/parameters/ProviderId"}]
      responses:
        "200": {description: 授权入口, content: {application/json: {schema: {$ref: "#/components/schemas/OIDCStart"}}}}
        "503": {description: 提供方不可用, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/auth/login:
    post:
      operationId: loginLocal
      summary: 使用本地密码登录
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LocalLoginRequest"}}}}
      responses:
        "200": {description: 登录成功, content: {application/json: {schema: {$ref: "#/components/schemas/CurrentPrincipal"}}}}
        "401": {description: 凭据无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: 尝试过多, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/auth/logout:
    post:
      operationId: logoutCurrent
      summary: 退出当前会话
      security: []
      responses:
        "204": {description: 已退出}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: 退出全部会话
      responses:
        "204": {description: 已退出全部会话}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/auth/reauth/local:
    post:
      operationId: reauthenticateLocal
      summary: 使用本人本地密码完成近期认证
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReauthenticateLocalRequest"}}}}
      responses:
        "200": {description: 认证成功, content: {application/json: {schema: {$ref: "#/components/schemas/CurrentPrincipal"}}}}
        "401": {description: 凭据无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: 尝试过多, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: 查询当前身份
      responses:
        "200": {description: 当前身份, content: {application/json: {schema: {$ref: "#/components/schemas/CurrentPrincipal"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/users/me/password:
    put:
      operationId: changeCurrentPassword
      summary: 修改本人密码
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChangePasswordRequest"}}}}
      responses:
        "204": {description: 密码已修改，需要重新登录}
        "400": {description: 密码或请求无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "401": {description: 当前密码无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/users/me/sessions:
    get:
      operationId: listCurrentSessions
      summary: 分页查询本人有效会话
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 512}}
      responses:
        "200": {description: 会话列表, content: {application/json: {schema: {$ref: "#/components/schemas/SessionPage"}}}}
        "400": {description: 游标无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/users/me/external-identities:
    get:
      operationId: listCurrentExternalIdentities
      summary: 分页查询本人外部身份
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 512}}
      responses:
        "200": {description: 外部身份列表, content: {application/json: {schema: {$ref: "#/components/schemas/ExternalIdentityPage"}}}}
        "400": {description: 游标无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/users/me/external-identities/{providerId}/bind:
    post:
      operationId: startExternalIdentityBinding
      summary: 开始外部身份绑定
      parameters: [{$ref: "#/components/parameters/ProviderId"}]
      responses:
        "200": {description: 授权入口, content: {application/json: {schema: {$ref: "#/components/schemas/OIDCStart"}}}}
        "403": {description: 需要近期认证, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/users/me/external-identities/{identityId}:
    delete:
      operationId: unbindExternalIdentity
      summary: 解除本人外部身份
      parameters: [{$ref: "#/components/parameters/IdentityId"}]
      responses:
        "204": {description: 已解除并撤销原会话}
        "403": {description: 需要近期认证, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: 外部身份不存在, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: 最后登录入口保护, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/auth/admissions:
    get:
      operationId: listAdmissions
      summary: 分页查询待处理外部身份
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 512}}
      responses:
        "200": {description: 准入列表, content: {application/json: {schema: {$ref: "#/components/schemas/ExternalIdentityPage"}}}}
        "400": {description: 游标无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: 需要平台管理员, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/auth/admissions/{identityId}/approve:
    post:
      operationId: approveAdmission
      summary: 批准外部身份准入
      parameters: [{$ref: "#/components/parameters/IdentityId"}]
      responses:
        "200": {description: 已创建或返回正式用户, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        "403": {description: 需要近期认证的平台管理员, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: 外部身份不存在, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: 准入状态冲突, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/auth/admissions/{identityId}/reject:
    post:
      operationId: rejectAdmission
      summary: 拒绝外部身份准入
      parameters: [{$ref: "#/components/parameters/IdentityId"}]
      responses:
        "200": {description: 已拒绝, content: {application/json: {schema: {$ref: "#/components/schemas/ExternalIdentity"}}}}
        "403": {description: 需要近期认证的平台管理员, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: 外部身份不存在, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: 准入状态冲突, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/auth/admissions/{identityId}/reopen:
    post:
      operationId: reopenAdmission
      summary: 重新打开被拒绝准入
      parameters: [{$ref: "#/components/parameters/IdentityId"}]
      responses:
        "200": {description: 已重新打开, content: {application/json: {schema: {$ref: "#/components/schemas/ExternalIdentity"}}}}
        "403": {description: 需要近期认证的平台管理员, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: 外部身份不存在, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: 准入状态冲突, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/users:
    get:
      operationId: listUsers
      summary: 分页查询用户
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 512}}
      responses:
        "200": {description: 用户列表, content: {application/json: {schema: {$ref: "#/components/schemas/UserPage"}}}}
        "400": {description: 游标无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: 需要平台管理员, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    post:
      operationId: createLocalUser
      summary: 创建本地用户
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateLocalUserRequest"}}}}
      responses:
        "201": {description: 用户已创建, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        "400": {description: 请求无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: 需要近期认证的平台管理员, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: 登录名冲突, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/users/{userId}:
    get:
      operationId: getUser
      summary: 查询用户
      parameters: [{$ref: "#/components/parameters/UserId"}]
      responses:
        "200": {description: 用户, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        "403": {description: 需要平台管理员, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: 用户不存在, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/users/{userId}/platform-role:
    put:
      operationId: changeUserPlatformRole
      summary: 修改平台角色
      parameters: [{$ref: "#/components/parameters/UserId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChangePlatformRoleRequest"}}}}
      responses:
        "200": {description: 用户已更新, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        "403": {description: 需要近期认证的平台管理员, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: 用户不存在, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: 最后管理员保护, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/users/{userId}/disable:
    post:
      operationId: disableUser
      summary: 停用用户
      parameters: [{$ref: "#/components/parameters/UserId"}]
      responses:
        "200": {description: 用户已停用, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        "403": {description: 需要近期认证的平台管理员, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: 用户不存在, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: 最后管理员或 owner 保护, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/users/{userId}/enable:
    post:
      operationId: enableUser
      summary: 启用用户
      parameters: [{$ref: "#/components/parameters/UserId"}]
      responses:
        "200": {description: 用户已启用, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        "403": {description: 需要近期认证的平台管理员, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: 用户不存在, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/users/{userId}/password/reset:
    post:
      operationId: resetUserLocalPassword
      summary: 重置用户本地密码
      parameters: [{$ref: "#/components/parameters/UserId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ResetLocalPasswordRequest"}}}}
      responses:
        "204": {description: 密码已重置}
        "400": {description: 密码无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: 需要近期认证的平台管理员, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: 用户不存在, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: 分页查询当前用户的项目
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 512}}
      responses:
        "200": {description: 项目列表, content: {application/json: {schema: {$ref: "#/components/schemas/ProjectPage"}}}}
        "400": {description: 游标无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    post:
      operationId: createProject
      summary: 创建项目
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: 项目已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "409":
          description: 幂等键已经用于不同请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/projects/{projectId}:
    get:
      operationId: getProject
      summary: 查询项目
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/projects/{projectId}/members:
    get:
      operationId: listProjectMembers
      summary: 分页查询项目成员
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 512}}
      responses:
        "200":
          description: 项目成员列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberPage"
        "400":
          description: 游标无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 项目不存在或当前操作者不是项目成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: addProjectMember
      summary: 添加项目成员
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectMemberRequest"
      responses:
        "201":
          description: 项目成员已添加
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          description: User ID 或项目角色无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 当前项目角色不能管理成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 项目不存在或当前操作者不是项目成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 成员已经存在或幂等键冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/projects/{projectId}/members/{userId}:
    put:
      operationId: updateProjectMember
      summary: 修改项目成员角色
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectMemberRequest"
      responses:
        "200":
          description: 项目成员角色已修改
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          description: User ID 或项目角色无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 当前项目角色不能管理成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 项目或成员不存在，或者当前操作者不是项目成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 操作会移除最后一个 owner，或幂等键冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: removeProjectMember
      summary: 移除项目成员
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
