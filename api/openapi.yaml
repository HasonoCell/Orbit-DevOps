        "200": {description: 点时入口诊断, content: {application/json: {schema: {$ref: "#/components/schemas/AccessHostStatus"}}}}
        "404": {description: 域名不可见, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/projects/{projectId}/access-hosts/{hostId}/routes:
    get:
      operationId: listAccessRoutes
      summary: 查询域名的路径路由
      parameters: [{$ref: "#/components/parameters/ProjectId"}, {$ref: "#/components/parameters/HostId"}, {$ref: "#/components/parameters/AccessPageLimit"}, {$ref: "#/components/parameters/AccessPageOffset"}]
      responses:
        "200": {description: 路由列表, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AccessRoute"}}}}}
        "404": {description: 域名不可见, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    post:
      operationId: createAccessRoute
      summary: 创建路径到 Target Service 的路由
      parameters: [{$ref: "#/components/parameters/ProjectId"}, {$ref: "#/components/parameters/HostId"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AccessRouteInput"}}}}
      responses:
        "201": {description: 路由已接纳, content: {application/json: {schema: {$ref: "#/components/schemas/AccessRoute"}}}}
        "400": {description: 输入无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: 权限不足, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: 域名或目标不可见, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: 路径或幂等键冲突, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/projects/{projectId}/access-hosts/{hostId}/routes/{routeId}:
    get:
      operationId: getAccessRoute
      summary: 查询路径路由
      parameters: [{$ref: "#/components/parameters/ProjectId"}, {$ref: "#/components/parameters/HostId"}, {$ref: "#/components/parameters/RouteId"}]
      responses:
        "200": {description: 路由, content: {application/json: {schema: {$ref: "#/components/schemas/AccessRoute"}}}}
        "404": {description: 路由不可见, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    patch:
      operationId: updateAccessRoute
      summary: 修改路径路由
      parameters: [{$ref: "#/components/parameters/ProjectId"}, {$ref: "#/components/parameters/HostId"}, {$ref: "#/components/parameters/RouteId"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AccessRouteInput"}}}}
      responses:
        "200": {description: 路由已更新, content: {application/json: {schema: {$ref: "#/components/schemas/AccessRoute"}}}}
        "400": {description: 输入无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: 权限不足, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: 路由或目标不可见, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: 路径或幂等键冲突, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    delete:
      operationId: deleteAccessRoute
      summary: 删除路径路由
      parameters: [{$ref: "#/components/parameters/ProjectId"}, {$ref: "#/components/parameters/HostId"}, {$ref: "#/components/parameters/RouteId"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "202": {description: 已接纳清理, content: {application/json: {schema: {$ref: "#/components/schemas/AccessRoute"}}}}
        "403": {description: 权限不足, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: 路由不可见, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: 幂等键冲突, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/platform/access-secret-bindings:
    get:
      operationId: listAccessSecretBindings
      summary: 平台管理员查询已有 TLS Secret 授权登记
      parameters: [{$ref: "#/components/parameters/AccessPageLimit"}, {$ref: "#/components/parameters/AccessPageOffset"}]
      responses:
        "200": {description: 授权列表, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AccessSecretBinding"}}}}}
        "403": {description: 需要平台管理员, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    post:
      operationId: registerAccessSecretBinding
      summary: 平台管理员登记已有 TLS Secret 给指定 Project 和 hostname
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AccessSecretBindingInput"}}}}
      responses:
        "201": {description: 已登记, content: {application/json: {schema: {$ref: "#/components/schemas/AccessSecretBinding"}}}}
        "400": {description: 输入无效, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: 需要近期认证的平台管理员, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: 授权或幂等冲突, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/platform/access-secret-bindings/{bindingId}:
    delete:
      operationId: revokeAccessSecretBinding
      summary: 平台管理员撤销已有 TLS Secret 授权
      parameters: [{$ref: "#/components/parameters/BindingId"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "200": {description: 已撤销, content: {application/json: {schema: {$ref: "#/components/schemas/AccessSecretBinding"}}}}
        "403": {description: 需要近期认证的平台管理员, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: 登记不存在, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: 幂等冲突, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        default: {description: 请求失败, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: __Host-orbit-session
  parameters:
    AccessPageLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    AccessPageOffset:
      name: offset
      in: query
      required: false
      schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: {type: string, minLength: 2, maxLength: 63}
    IdentityId:
      name: identityId
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    BuildOperationId:
      name: buildOperationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 当前操作者与写操作范围内的幂等标识。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    DeliveryPipelineId:
      name: deliveryPipelineId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DeliveryRunId:
      name: deliveryRunId
      in: path
      required: true
      schema: {type: string, format: uuid}
    HostId:
      name: hostId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RouteId:
      name: routeId
      in: path
      required: true
      schema: {type: string, format: uuid}
    BindingId:
      name: bindingId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    AccessSecretBindingInput:
      type: object
      additionalProperties: false
      required: [projectId, hostname, secretName]
      properties:
        projectId: {type: string, format: uuid}
        hostname: {type: string, minLength: 4, maxLength: 253}
        secretName: {type: string, minLength: 1, maxLength: 253}
    AccessSecretBinding:
      type: object
      additionalProperties: false
      required: [id, projectId, clusterRef, namespace, hostname, secretName, state, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        clusterRef: {type: string}
        namespace: {type: string}
        hostname: {type: string}
        secretName: {type: string}
        state: {type: string, enum: [active, revoked]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AccessHostInput:
      type: object
      additionalProperties: false
      required: [hostname, tlsMode]
      properties:
        hostname: {type: string, minLength: 4, maxLength: 253}
        tlsMode: {type: string, enum: [http_only, managed, existing_secret]}
        issuerPolicyKey: {type: string, minLength: 1, maxLength: 63}
        secretBindingId: {type: string, format: uuid}
    AccessHost:
      type: object
      additionalProperties: false
      required: [id, projectId, clusterRef, namespace, hostname, tlsMode, lifecycle, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        clusterRef: {type: string}
        namespace: {type: string}
        hostname: {type: string}
        tlsMode: {type: string, enum: [http_only, managed, existing_secret]}
        issuerPolicyKey: {type: string}
        secretBindingId: {type: string, format: uuid}
        lifecycle: {type: string, enum: [active, deleting]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AccessHostStatus:
      type: object
      additionalProperties: false
      required: [host, sync, controller, dns]
      properties:
        host: {$ref: "#/components/schemas/AccessHost"}
        sync: {$ref: "#/components/schemas/AccessSyncStatus"}
        controller: {$ref: "#/components/schemas/AccessControllerStatus"}
        dns: {$ref: "#/components/schemas/AccessDnsStatus"}
    AccessSyncStatus:
      type: object
      additionalProperties: false
      required: [desiredRevision, appliedRevision, state]
      properties:
        desiredRevision: {type: integer, format: int64}
        appliedRevision: {type: integer, format: int64}
        state: {type: string, enum: [pending, applying, applied, retrying, attention_required, deleting]}
        lastErrorCode: {type: string}
    AccessControllerStatus:
      type: object
      additionalProperties: false
      required: [gatewayState, listenerState, routes, certificateState, secretState, addresses, observedAt]
      properties:
        gatewayState: {type: string, enum: [ready, not_ready, unknown]}
        listenerState: {type: string, enum: [ready, not_ready, unknown]}
        routes: {type: array, items: {$ref: "#/components/schemas/AccessRouteObservation"}}
        certificateState: {type: string, enum: [ready, not_ready, unknown, not_applicable]}
        certificateNotAfter: {type: string, format: date-time}
        secretState: {type: string, enum: [ready, not_ready, unknown, not_applicable]}
        addresses: {type: array, items: {type: string}}
        errorCode: {type: string}
        observedAt: {type: string, format: date-time}
    AccessRouteObservation:
      type: object
      additionalProperties: false
      required: [routeId, accepted, resolvedRefs]
      properties:
        routeId: {type: string, format: uuid}
        accepted: {type: string, enum: [ready, not_ready, unknown]}
        resolvedRefs: {type: string, enum: [ready, not_ready, unknown]}
    AccessDnsStatus:
      type: object
      additionalProperties: false
      required: [state, answers, observedAt]
      properties:
        state: {type: string, enum: [verified, mismatch, unavailable, not_configured]}
        answers: {type: array, items: {type: string}}
        errorCode: {type: string}
        observedAt: {type: string, format: date-time}
    AccessRouteInput:
      type: object
      additionalProperties: false
      required: [pathPrefix, deploymentTargetId]
      properties:
        pathPrefix: {type: string, minLength: 1, maxLength: 1024}
        deploymentTargetId: {type: string, format: uuid}
    AccessRoute:
      type: object
      additionalProperties: false
      required: [id, hostId, deploymentTargetId, pathPrefix, lifecycle, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        hostId: {type: string, format: uuid}
        deploymentTargetId: {type: string, format: uuid}
        pathPrefix: {type: string}
        lifecycle: {type: string, enum: [active, deleting]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AuthProviderSummary:
      type: object
      additionalProperties: false
      required: [id, type, displayName, available]
      properties:
        id: {type: string}
        type: {type: string, enum: [local, oidc]}
        displayName: {type: string}
        available: {type: boolean}
    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [loginName, password]
      properties:
        loginName: {type: string, minLength: 3, maxLength: 128}
        password: {type: string, format: password, minLength: 1, maxLength: 512, writeOnly: true}
    ReauthenticateLocalRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, format: password, minLength: 1, maxLength: 512, writeOnly: true}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        currentPassword: {type: string, format: password, minLength: 1, maxLength: 512, writeOnly: true}
        newPassword: {type: string, format: password, minLength: 12, maxLength: 512, writeOnly: true}
        loginName: {type: string, minLength: 3, maxLength: 128}
    CreateLocalUserRequest:
      type: object
      additionalProperties: false
      required: [loginName, displayName, temporaryPassword]
      properties:
        loginName: {type: string, minLength: 3, maxLength: 128}
        displayName: {type: string, minLength: 1, maxLength: 128}
        temporaryPassword: {type: string, format: password, minLength: 12, maxLength: 512, writeOnly: true}
    ResetLocalPasswordRequest:
      type: object
      additionalProperties: false
      required: [temporaryPassword]
      properties:
        temporaryPassword: {type: string, format: password, minLength: 12, maxLength: 512, writeOnly: true}
        loginName: {type: string, minLength: 3, maxLength: 128}
    ChangePlatformRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: {$ref: "#/components/schemas/PlatformRole"}
    PlatformRole:
      type: string
      enum: [platform_admin, user]
    UserStatus:
      type: string
      enum: [active, disabled]
    User:
      type: object
      additionalProperties: false
      required: [id, displayName, status, platformRole, createdAt]
      properties:
        id: {type: string, format: uuid}
        displayName: {type: string}
        status: {$ref: "#/components/schemas/UserStatus"}
        platformRole: {$ref: "#/components/schemas/PlatformRole"}
        createdAt: {type: string, format: date-time}
    CurrentUser:
      type: object
      additionalProperties: false
      required: [user, mustChangePassword]
      properties:
        user: {$ref: "#/components/schemas/User"}
        mustChangePassword: {type: boolean}
    CurrentPrincipal:
      type: object
      additionalProperties: false
      required: [kind, mustChangePassword]
      properties:
        kind: {type: string, enum: [user, pending]}
        user: {$ref: "#/components/schemas/User"}
        externalIdentity: {$ref: "#/components/schemas/ExternalIdentity"}
        mustChangePassword: {type: boolean}
    OIDCStart:
      type: object
      additionalProperties: false
      required: [authorizationUrl, expiresAt]
      properties:
        authorizationUrl: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
    ExternalIdentity:
      type: object
      additionalProperties: false
      required: [id, providerId, status, displayName, emailVerified, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        providerId: {type: string}
        status: {type: string, enum: [pending, rejected, linked]}
        userId: {type: string, format: uuid}
        displayName: {type: string}
        email: {type: string, format: email}
        emailVerified: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ExternalIdentityPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ExternalIdentity"}}
        nextCursor: {type: string}
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, method, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id: {type: string, format: uuid}
        method: {type: string, enum: [password, oidc]}
        providerId: {type: string}
        createdAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        current: {type: boolean}
    SessionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/SessionSummary"}}
        nextCursor: {type: string}
    UserPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/User"}}
        nextCursor: {type: string}
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z][a-z0-9-]*$"
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Project"}}
        nextCursor: {type: string}
    ProjectPermission:
      type: string
      enum: [read, read_logs, develop, manage_members, manage_owners, resolve_unknown, manage_access_hosts, manage_access_routes]
    ProjectPermissions:
      type: object
      additionalProperties: false
      required: [projectId, role, allowed]
      properties:
        projectId: {type: string, format: uuid}
        role: {$ref: "#/components/schemas/ProjectRole"}
        allowed: {type: array, items: {$ref: "#/components/schemas/ProjectPermission"}}
    AddProjectMemberRequest:
      type: object
      additionalProperties: false
      required:
        - userId
        - role
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ProjectRole"
    UpdateProjectMemberRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
    ProjectRole:
      type: string
      enum:
        - owner
        - admin
        - developer
        - viewer
    ProjectMember:
      type: object
      additionalProperties: false
      required:
        - projectId
        - userId
        - role
        - createdBy
        - createdAt
        - updatedAt
      properties:
        projectId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ProjectRole"
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectMemberPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ProjectMember"}
        nextCursor: {type: string}
    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z][a-z0-9-]*$"
    Application:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - name
        - slug
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    ApplicationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Application"}}
        nextCursor: {type: string}
    CreateDeploymentTargetRequest:
      type: object
      additionalProperties: false
      required:
        - stage
        - replicas
        - containerPort
      properties:
        stage:
          type: string
          enum:
            - development
        replicas:
          type: integer
          minimum: 1
          maximum: 5
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
    UpdateDeploymentTargetRequest:
      type: object
      additionalProperties: false
      required:
        - stage
        - replicas
        - containerPort
      properties:
        stage:
          type: string
          enum:
            - development
        replicas:
          type: integer
          minimum: 1
          maximum: 5
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
    DeploymentTarget:
      type: object
      additionalProperties: false
      required:
        - id
        - applicationId
        - stage
        - clusterRef
        - namespace
        - replicas
        - containerPort
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        stage:
          type: string
          enum:
            - development
        clusterRef:
          type: string
        namespace:
          type: string
        replicas:
          type: integer
        containerPort:
          type: integer
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeploymentTargetPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/DeploymentTarget"}}
        nextCursor: {type: string}
    CreateBuildRequest:
      type: object
      additionalProperties: false
      required:
        - repositoryUrl
        - sourceCommit
      properties:
        repositoryUrl:
          type: string
          format: uri
          minLength: 12
          maxLength: 2048
          description: 不含凭据且 Host 位于服务端允许列表的 HTTPS Git Clone URL。
        sourceCommit:
          type: string
          pattern: "^[a-fA-F0-9]{40}([a-fA-F0-9]{24})?$"
          description: 完整 Git Commit SHA；Branch 与 Tag 不作为不可变构建输入。
