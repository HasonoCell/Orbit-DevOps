openapi: 3.0.3
info:
  title: OrbitOps API
  version: 0.1.0
  description: OrbitOps 应用交付控制平面的公开 HTTP 契约。
paths:
  /api/v1/projects:
    post:
      operationId: createProject
      summary: 创建项目
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: 项目已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "409":
          description: 幂等键已经用于不同请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/projects/{projectId}:
    get:
      operationId: getProject
      summary: 查询项目
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/projects/{projectId}/members:
    get:
      operationId: listProjectMembers
      summary: 查询项目成员
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 项目成员列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "404":
          description: 项目不存在或当前操作者不是项目成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: addProjectMember
      summary: 添加项目成员
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectMemberRequest"
      responses:
        "201":
          description: 项目成员已添加
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          description: Actor ID 或项目角色无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 当前项目角色不能管理成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 项目不存在或当前操作者不是项目成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 成员已经存在或幂等键冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/projects/{projectId}/members/{actorId}:
    put:
      operationId: updateProjectMember
      summary: 修改项目成员角色
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectMemberRequest"
      responses:
        "200":
          description: 项目成员角色已修改
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          description: Actor ID 或项目角色无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 当前项目角色不能管理成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 项目或成员不存在，或者当前操作者不是项目成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 操作会移除最后一个 owner，或幂等键冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: removeProjectMember
      summary: 移除项目成员
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 已移除的项目成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          description: Actor ID 无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 当前项目角色不能管理成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 项目或成员不存在，或者当前操作者不是项目成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 操作会移除最后一个 owner，或幂等键冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/projects/{projectId}/applications:
    post:
      operationId: createApplication
      summary: 创建应用
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: 应用已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 当前项目角色不能创建应用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 幂等键已经用于不同请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/applications/{applicationId}:
    get:
      operationId: getApplication
      summary: 查询应用
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 应用详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: 应用不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/applications/{applicationId}/deployment-targets:
    post:
      operationId: createDeploymentTarget
      summary: 创建部署目标
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeploymentTargetRequest"
      responses:
        "201":
          description: 部署目标已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentTarget"
        "404":
          description: 应用不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 当前项目角色不能创建部署目标
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 幂等键已经用于不同请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/deployment-targets/{deploymentTargetId}:
    get:
      operationId: getDeploymentTarget
      summary: 查询部署目标
      parameters:
        - name: deploymentTargetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 部署目标详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentTarget"
        "404":
          description: 部署目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateDeploymentTarget
      summary: 更新部署目标的可变期望配置
      parameters:
        - name: deploymentTargetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeploymentTargetRequest"
      responses:
        "200":
          description: 部署目标已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentTarget"
        "404":
          description: 部署目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 当前项目角色不能修改部署目标
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 幂等键已经用于不同请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/deployment-targets/{deploymentTargetId}/releases:
    post:
      operationId: createRelease
      summary: 创建发布并接纳异步操作
      parameters:
        - name: deploymentTargetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseRequest"
      responses:
        "201":
          description: 发布与待处理操作已原子创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseAcceptance"
        "400":
          description: 镜像引用不是有效的不可变 OCI 引用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 部署目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 当前项目角色不能创建发布
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 幂等键已经用于不同请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/deployment-targets/{deploymentTargetId}/runtime-snapshot:
    get:
      operationId: getRuntimeSnapshot
      summary: 从 Kubernetes 查询部署目标的当前运行状态
      parameters:
        - name: deploymentTargetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Kubernetes 运行时快照；不可访问时 freshness 为 unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSnapshot"
        "404":
          description: 部署目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/releases/{releaseId}:
    get:
      operationId: getRelease
      summary: 查询发布
      parameters:
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 发布详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "404":
          description: 发布不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/operations/{operationId}:
    get:
      operationId: getOperation
      summary: 查询异步操作
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 操作详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          description: 操作不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/operations/{operationId}/retry:
    post:
      operationId: retryOperation
      summary: 重新排队一个确定失败的操作
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 原 Operation 已重新进入目标队尾
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "403":
          description: 当前项目角色不能重试操作
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 操作不存在或当前操作者不是项目成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 当前状态不允许重试，或幂等键冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/operations/{operationId}/cancel:
    post:
      operationId: cancelOperation
      summary: 取消排队中或运行中的操作
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 操作已取消或已记录取消请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "403":
          description: 当前项目角色不能取消操作
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 操作不存在或当前操作者不是项目成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 当前状态不允许取消，或幂等键冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 当前操作者与写操作范围内的幂等标识。
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z][a-z0-9-]*$"
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    AddProjectMemberRequest:
      type: object
      additionalProperties: false
      required:
        - actorId
        - role
      properties:
        actorId:
          type: string
          minLength: 1
          maxLength: 128
        role:
          $ref: "#/components/schemas/ProjectRole"
    UpdateProjectMemberRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
    ProjectRole:
      type: string
      enum:
        - owner
        - developer
        - viewer
    ProjectMember:
      type: object
      additionalProperties: false
      required:
        - projectId
        - actorId
        - role
        - createdBy
        - createdAt
        - updatedAt
      properties:
        projectId:
          type: string
          format: uuid
        actorId:
          type: string
        role:
          $ref: "#/components/schemas/ProjectRole"
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z][a-z0-9-]*$"
    Application:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - name
        - slug
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateDeploymentTargetRequest:
      type: object
      additionalProperties: false
      required:
        - stage
        - replicas
        - containerPort
      properties:
        stage:
          type: string
          enum:
            - development
        replicas:
          type: integer
          minimum: 1
          maximum: 5
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
    UpdateDeploymentTargetRequest:
      type: object
      additionalProperties: false
      required:
        - stage
        - replicas
        - containerPort
      properties:
        stage:
          type: string
          enum:
            - development
        replicas:
          type: integer
          minimum: 1
          maximum: 5
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
    DeploymentTarget:
      type: object
      additionalProperties: false
      required:
        - id
        - applicationId
        - stage
        - clusterRef
        - namespace
        - replicas
        - containerPort
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        stage:
          type: string
          enum:
            - development
        clusterRef:
          type: string
        namespace:
          type: string
        replicas:
          type: integer
        containerPort:
          type: integer
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateReleaseRequest:
      type: object
      additionalProperties: false
      required:
        - imageReference
      properties:
        imageReference:
          type: string
          minLength: 73
          maxLength: 512
          pattern: "^[^[:space:]@]+@sha256:[a-f0-9]{64}$"
          description: 包含 sha256 Digest 的不可变 OCI 镜像引用。
    ReleaseTargetSnapshot:
      type: object
      additionalProperties: false
      required:
        - projectId
        - applicationId
        - stage
        - clusterRef
        - namespace
        - replicas
        - containerPort
      properties:
        projectId:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        stage:
          type: string
          enum:
            - development
        clusterRef:
          type: string
        namespace:
          type: string
        replicas:
          type: integer
        containerPort:
          type: integer
    Release:
      type: object
      additionalProperties: false
      required:
        - id
        - deploymentTargetId
        - imageReference
        - targetSnapshot
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        deploymentTargetId:
          type: string
          format: uuid
        imageReference:
          type: string
        targetSnapshot:
          $ref: "#/components/schemas/ReleaseTargetSnapshot"
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    RetryDisposition:
      type: string
      enum:
        - retryable
        - non_retryable
        - unknown_outcome
    Operation:
      type: object
      additionalProperties: false
      required:
        - id
        - type
