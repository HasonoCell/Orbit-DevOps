      parameters: [{$ref: "#/components/parameters/ProjectId"}, {$ref: "#/components/parameters/HostId"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AccessHostInput"}}}}
