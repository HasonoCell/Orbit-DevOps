openapi: 3.0.3
info:
  title: OrbitOps API
  version: 0.1.0
  description: OrbitOps 应用交付控制平面的公开 HTTP 契约。
paths:
  /api/v1/projects:
    post:
      operationId: createProject
      summary: 创建项目
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: 项目已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "409":
          description: 幂等键已经用于不同请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/projects/{projectId}:
    get:
      operationId: getProject
      summary: 查询项目
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/projects/{projectId}/applications:
    post:
      operationId: createApplication
      summary: 创建应用
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: 应用已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 幂等键已经用于不同请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/applications/{applicationId}:
    get:
      operationId: getApplication
      summary: 查询应用
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 应用详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: 应用不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/applications/{applicationId}/deployment-targets:
    post:
      operationId: createDeploymentTarget
      summary: 创建部署目标
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeploymentTargetRequest"
      responses:
        "201":
          description: 部署目标已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentTarget"
        "404":
          description: 应用不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 幂等键已经用于不同请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/deployment-targets/{deploymentTargetId}:
    get:
      operationId: getDeploymentTarget
      summary: 查询部署目标
      parameters:
        - name: deploymentTargetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 部署目标详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentTarget"
        "404":
          description: 部署目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/deployment-targets/{deploymentTargetId}/releases:
    post:
      operationId: createRelease
      summary: 创建发布并接纳异步操作
      parameters:
        - name: deploymentTargetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseRequest"
      responses:
        "201":
          description: 发布与待处理操作已原子创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseAcceptance"
        "400":
          description: 镜像引用不是有效的不可变 OCI 引用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 部署目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 幂等键已经用于不同请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/releases/{releaseId}:
    get:
      operationId: getRelease
      summary: 查询发布
      parameters:
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 发布详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "404":
          description: 发布不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/operations/{operationId}:
    get:
      operationId: getOperation
      summary: 查询异步操作
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 操作详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          description: 操作不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 当前操作者与写操作范围内的幂等标识。
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z][a-z0-9-]*$"
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z][a-z0-9-]*$"
    Application:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - name
        - slug
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateDeploymentTargetRequest:
      type: object
      additionalProperties: false
      required:
        - stage
        - replicas
        - containerPort
      properties:
        stage:
          type: string
          enum:
            - development
        replicas:
          type: integer
          minimum: 1
          maximum: 5
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
    DeploymentTarget:
      type: object
      additionalProperties: false
      required:
        - id
        - applicationId
        - stage
        - clusterRef
        - namespace
        - replicas
        - containerPort
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        stage:
          type: string
          enum:
            - development
        clusterRef:
          type: string
        namespace:
          type: string
        replicas:
          type: integer
        containerPort:
          type: integer
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateReleaseRequest:
      type: object
      additionalProperties: false
      required:
        - imageReference
      properties:
        imageReference:
          type: string
          minLength: 73
          maxLength: 512
          pattern: "^[^[:space:]@]+@sha256:[a-f0-9]{64}$"
          description: 包含 sha256 Digest 的不可变 OCI 镜像引用。
    ReleaseTargetSnapshot:
      type: object
      additionalProperties: false
      required:
        - applicationId
        - stage
        - clusterRef
        - namespace
        - replicas
        - containerPort
      properties:
        applicationId:
          type: string
          format: uuid
        stage:
          type: string
          enum:
            - development
        clusterRef:
          type: string
        namespace:
          type: string
        replicas:
          type: integer
        containerPort:
          type: integer
    Release:
      type: object
      additionalProperties: false
      required:
        - id
        - deploymentTargetId
        - imageReference
        - targetSnapshot
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        deploymentTargetId:
          type: string
          format: uuid
        imageReference:
          type: string
        targetSnapshot:
          $ref: "#/components/schemas/ReleaseTargetSnapshot"
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    Operation:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - releaseId
        - createdBy
        - idempotencyKey
        - status
        - attemptCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - release.deploy
        releaseId:
          type: string
          format: uuid
        createdBy:
          type: string
        idempotencyKey:
          type: string
        status:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
        attemptCount:
          type: integer
          minimum: 0
        errorCategory:
          type: string
        errorSummary:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    ReleaseAcceptance:
      type: object
      additionalProperties: false
      required:
        - release
        - operation
      properties:
        release:
          $ref: "#/components/schemas/Release"
        operation:
          $ref: "#/components/schemas/Operation"
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
